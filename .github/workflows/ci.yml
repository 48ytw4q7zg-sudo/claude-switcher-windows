name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 本项目只面向 Windows；macOS CI 已按「只做 Windows」的产品决定移除。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      # cs.exe 是本包第二个 [[bin]]（src/bin/cs.rs），由后续 tauri build 自动编译并打包；
      # 不再使用 bundle.externalBin 与占位文件（externalBin 与 cargo 二进制重复打包会触发
      # WiX ICE30）。
      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 单元测试需要交互式凭据存储的用例标记为 #[ignore]；这里只跑非 ignore 的。
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tauri build
        run: npm run tauri build
