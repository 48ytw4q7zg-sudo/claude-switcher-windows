name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 本项目只面向 Windows；macOS CI 已按「只做 Windows」的产品决定移除。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      # cs.exe 是本包第二个 [[bin]]（src/bin/cs.rs），由后续 tauri build 自动编译并打包；
      # 不再使用 bundle.externalBin 与占位文件（externalBin 与 cargo 二进制重复打包会触发
      # WiX ICE30）。
      # L-08 (v0.7.1): fail fast on a malformed/mismatched version.
      # The 4-segment version broke `cargo metadata` and killed the whole
      # build after every other check had already passed.
      - name: Version consistency and manifest preflight
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $pkgVer = (Select-String -Path package.json -Pattern '"version"\s*:\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tauriVer = (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"\s*:\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "cargo=$cargoVer package=$pkgVer tauri=$tauriVer"
          if ($cargoVer -ne $pkgVer -or $cargoVer -ne $tauriVer) {
            throw "Version mismatch: Cargo.toml=$cargoVer package.json=$pkgVer tauri.conf.json=$tauriVer"
          }
          if ($cargoVer -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be exactly three numeric segments (Cargo rejects 4): $cargoVer"
          }
          Push-Location src-tauri
          try {
            cargo metadata --format-version 1 --no-deps | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          } finally { Pop-Location }
          Write-Host "version + manifest preflight OK"

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 单元测试需要交互式凭据存储的用例标记为 #[ignore]；这里只跑非 ignore 的。
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # **L-16（v0.7.3）**：把本轮安全修复对应的回归场景**单独点名跑一遍**。
      #
      # 全量 `cargo test` 已经包含它们，但那样「某个安全测试被误删/被
      # #[ignore] 掉」不会有人发现——这里按名字过滤，少一个就会因为
      # 「0 tests filtered in」而失败（cargo 对无匹配测试返回非 0）。
      #
      # 覆盖：PowerShell 三态协议、TUN 双栈证据、GUI/CLI 身份、布防就绪、
      # 自动解除复核、报告语义。
      - name: Security regression scenarios
        working-directory: src-tauri
        shell: pwsh
        run: |
          $groups = @(
            'ps_protocol',
            'tun_path_requires_both_families_and_trusted_dns',
            'route_evidence_is_bound_to_its_target',
            'gui_identity_separates_cli_from_unknown',
            'classify_rejects_cli_and_unknown_paths',
            'arm_readiness_tests',
            'automatic_release_aborts_when_state_changed',
            'isolation_refuses_when_expected_revision_is_stale',
            'release_report_never_claims_success_with_failures',
            'aborted_trip_does_not_touch_isolation_state',
            'legacy_cleanup_never_targets_the_global_cut_rule',
            'tun_access_counts_only_with_route_evidence',
            'unknown_reconfirm_backs_off_and_caps',
            'auto_probe_requires_proven_udp_route',
            'unsigned_updates_are_never_auto_executed',
            'strict_oauth_mode',
            'trip_summary',
            'trip_outcome_state_policy',
            'uncovered_auto_release',
            'strict_blocked_makes_zero_outbound_connections',
            'strict_proxy_path_is_used_and_redirects_are_refused',
            'tun_route_issuses_zero_dns_queries',
            'trusted_dns_channel_is_not_available_yet',
            'ready_reconciliation_only_counts_uncovered_source',
            'revision_bumps_only_for_security_relevant_changes',
            'strict_leak_mode_locks_down_on_unproven_access',
            'uncovered_lock_reason_distinguishes_strict_mode'
          )
          $failed = @()
          foreach ($g in $groups) {
            Write-Host "::group::$g"
            $output = & cargo test --lib $g 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            Write-Host "::endgroup::"
            if ($code -ne 0) { $failed += $g }
            elseif ($output -match 'running 0 tests') { $failed += "$g (no tests matched)" }
          }
          if ($failed.Count -gt 0) {
            throw "security regression scenarios failed or missing: $($failed -join ', ')"
          }
          Write-Host "all security regression scenarios present and passing"

      - name: Tauri build
        run: npm run tauri build
