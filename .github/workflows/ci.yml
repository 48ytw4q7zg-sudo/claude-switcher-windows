name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # cfg 门控下的 dead_code 只在目标平台编译时才暴露（例如 Windows-only 的
      # junction/icacls 代码、unix-only 的 keychain 代码）。macOS runner 的 host 是
      # aarch64-apple-darwin、target 是 x86_64-apple-darwin，两者不同才需要再跑一遍；
      # Windows runner 的 host 就是 x86_64-pc-windows-msvc，与 target 相同，上面的
      # 「Rust clippy」已经覆盖，重复跑只是浪费。
      - name: Rust clippy (target)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      # 单元测试需要交互式凭据存储的用例标记为 #[ignore]；这里只跑非 ignore 的。
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tauri build
        run: npm run tauri build
