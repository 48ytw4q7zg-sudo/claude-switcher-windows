name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 本项目只面向 Windows；macOS CI 已按「只做 Windows」的产品决定移除。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      # externalBin 鸡生蛋：clippy/test/tauri build 都会跑 build.rs 校验 sidecar 存在，
      # 而 cs 本身要靠 cargo 构建。先落 0 字节占位（只查 .exists()），再构建真实 cs
      # 覆盖占位。须与 windows-build.yml 的同名步骤保持一致。
      - name: Stage cs external binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $sidecar = "src-tauri/binaries/cs-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            New-Item -ItemType File -Path $sidecar | Out-Null
          }
          cargo build --release --bin cs --manifest-path src-tauri/Cargo.toml
          Copy-Item "src-tauri/target/release/cs.exe" $sidecar -Force
          Get-Item $sidecar | Select-Object Name,Length

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 单元测试需要交互式凭据存储的用例标记为 #[ignore]；这里只跑非 ignore 的。
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tauri build
        run: npm run tauri build
