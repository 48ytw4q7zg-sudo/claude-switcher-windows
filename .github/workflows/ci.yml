name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 本项目只面向 Windows；macOS CI 已按「只做 Windows」的产品决定移除。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      # cs.exe 是本包第二个 [[bin]]（src/bin/cs.rs），由后续 tauri build 自动编译并打包；
      # 不再使用 bundle.externalBin 与占位文件（externalBin 与 cargo 二进制重复打包会触发
      # WiX ICE30）。
      # L-08 (v0.7.1): fail fast on a malformed/mismatched version.
      # The 4-segment version broke `cargo metadata` and killed the whole
      # build after every other check had already passed.
      - name: Version consistency and manifest preflight
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $pkgVer = (Select-String -Path package.json -Pattern '"version"\s*:\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tauriVer = (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"\s*:\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "cargo=$cargoVer package=$pkgVer tauri=$tauriVer"
          if ($cargoVer -ne $pkgVer -or $cargoVer -ne $tauriVer) {
            throw "Version mismatch: Cargo.toml=$cargoVer package.json=$pkgVer tauri.conf.json=$tauriVer"
          }
          if ($cargoVer -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be exactly three numeric segments (Cargo rejects 4): $cargoVer"
          }
          Push-Location src-tauri
          try {
            cargo metadata --format-version 1 --no-deps | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          } finally { Pop-Location }
          Write-Host "version + manifest preflight OK"

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 单元测试需要交互式凭据存储的用例标记为 #[ignore]；这里只跑非 ignore 的。
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tauri build
        run: npm run tauri build
