name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# C-7：产物构建来源证明（attestation）需要 id-token/attestations 权限；
# tag 触发时自动创建 Release 上传产物，需要 contents: write。
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # J-1：先单独构建 cs 控制台程序，再以 target-triple 后缀放进 externalBin 目录。
      # tauri.conf.json 的 bundle.externalBin = ["binaries/cs"] 会在 MSI/NSIS 安装目录
      # 里落成 cs.exe（与主程序同目录，PATH 指向该目录即可全局使用）。
      #
      # 鸡生蛋：tauri-build 的 build.rs 在编译本 crate 任何目标（含 --bin cs）之前，
      # 都会校验 sidecar 路径 binaries/cs-<triple>.exe 存在，缺失即 panic
      # （resource path ... doesn't exist）。而该文件要等 cs 构建完才能产出。
      # 因此先落一个 0 字节占位文件让 build.rs 的存在性校验通过（它只查 .exists()，
      # 不校验是否为有效 PE），再构建 cs，最后用真实 cs.exe 覆盖占位。
      - name: Stage cs external binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $sidecar = "src-tauri/binaries/cs-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            New-Item -ItemType File -Path $sidecar | Out-Null
          }
          cargo build --release --bin cs --manifest-path src-tauri/Cargo.toml
          Copy-Item "src-tauri/target/release/cs.exe" $sidecar -Force
          Get-Item $sidecar | Select-Object Name,Length

      - name: Build app
        run: npm run tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # P2-4：便携版 zip。内含主 exe + cs.exe + portable.flag；运行时账号库/日志/配置与
      # WebView2 数据都落在 exe 目录（见 paths::portable_root），整体解压即用、
      # 拷走即迁移，不写注册表/用户目录。J-1：cs.exe 一并打包。
      - name: Build portable zip
        shell: pwsh
        run: |
          if (Test-Path portable-staging) { Remove-Item portable-staging -Recurse -Force }
          New-Item -ItemType Directory -Force portable-staging | Out-Null
          Copy-Item "src-tauri/target/release/claude-switcher.exe" `
            "portable-staging/ClaudeSwitcher.exe"
          Copy-Item "src-tauri/target/release/cs.exe" "portable-staging/cs.exe" -Force
          New-Item -ItemType File "portable-staging/portable.flag" | Out-Null
          Compress-Archive -Path "portable-staging/*" `
            -DestinationPath "ClaudeSwitcher-portable.zip" -Force
          Get-Item ClaudeSwitcher-portable.zip | Select-Object Name,Length

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-portable
          path: ClaudeSwitcher-portable.zip
          if-no-files-found: error

      # C-7：构建来源证明。用户可用
      #   gh attestation verify <文件> -R 48ytw4q7zg-sudo/claude-switcher-windows
      # 验证安装包确实来自本仓库 CI。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            ClaudeSwitcher-portable.zip

      # C-8：校验和用裸文件名生成（在资产目录内 sha256sum *），
      # 用户可直接 `sha256sum -c SHA256SUMS.txt` 或对照 Get-FileHash。
      # productName 已去空格（ClaudeSwitcher），GitHub 不会再把资产名空格换成点。
      - name: Stage release assets with checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp ClaudeSwitcher-portable.zip dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # C-7：tag 触发自动创建 Release（含 SHA256SUMS.txt），
      # 不再手工下载产物重传。workflow_dispatch 触发时只出 Actions 产物。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "${GITHUB_REF_NAME} — ClaudeSwitcher Windows" \
            --generate-notes
