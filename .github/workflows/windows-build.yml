name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# C-7：产物构建来源证明（attestation）需要 id-token/attestations 权限；
# tag 触发时自动创建 Release 上传产物，需要 contents: write。
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # cs.exe 由 src/bin/cs.rs 作为本包的第二个 [[bin]] 产出；`tauri build` 会编译
      # 全部二进制并自动把 target/release/cs.exe 打进 NSIS 安装目录（与主程序同目录，
      # PATH 指向该目录即可全局使用）。不再使用 bundle.externalBin：externalBin 会把同一
      # 份 cs.exe 再复制到临时目录生成第二个组件，与 cargo 二进制组件撞名触发 WiX ICE30
      # （两个组件向同一目录安装 cs.exe，破坏组件引用计数）。
      # L-08 (v0.7.1): same preflight as CI - a bad version must fail here,
      # not in the middle of a release build.
      - name: Version consistency and manifest preflight
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $pkgVer = (Select-String -Path package.json -Pattern '"version"\s*:\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tauriVer = (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"\s*:\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "cargo=$cargoVer package=$pkgVer tauri=$tauriVer"
          if ($cargoVer -ne $pkgVer -or $cargoVer -ne $tauriVer) {
            throw "Version mismatch: Cargo.toml=$cargoVer package.json=$pkgVer tauri.conf.json=$tauriVer"
          }
          if ($cargoVer -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be exactly three numeric segments (Cargo rejects 4): $cargoVer"
          }
          Push-Location src-tauri
          try {
            cargo metadata --format-version 1 --no-deps | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          } finally { Pop-Location }
          Write-Host "version + manifest preflight OK"

      # **P2-02**：发布前必须自己跑一遍质量门禁。
      #
      # 原实现只有「版本预检 → tauri build → 创建 Release」：CI 是另一个
      # workflow，tag 推送并不会等它跑完，因此**未通过测试的提交也可能发版**。
      # 这里把同一组门禁搬进发布链路（宁可慢几分钟，也不发一个编译得过但
      # 逻辑坏掉的包）。
      - name: Quality gate (Rust)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      # **P2-02（v0.7.6）**：安全回归场景由**同一份脚本**执行，CI 与 tag 发布共用。
      #
      # 上一轮两套门禁分叉过：CI 因为陈旧测试名失败，发布构建却绿了（它跑的是
      # 无过滤的 cargo test --lib）。现在只有一个来源，测试改名/删除时两边同时报警。
      - name: Security regression scenarios
        shell: pwsh
        run: ./scripts/check-security-regressions.ps1
      - name: Quality gate (Frontend)
        run: |
          npx tsc --noEmit
          npm run build

      # **P2-02**：tag 必须是 `v<Cargo.toml 的版本>`，否则安装器、更新检查、
      # 发布资产三处的版本会互相不一致。
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$cargoVer") {
            throw "Tag '$tag' does not match package version v$cargoVer"
          }
          Write-Host "tag $tag matches package version $cargoVer"

      - name: Build app
        run: npm run tauri build

      # v0.6.13 起不再构建 MSI：MSI 无法接入卸载前的恢复钩子，
      # 卸载时可能留下本产品创建的防火墙规则。详见 docs/release-v0.6.13.md。

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # P2-4：便携版 zip。内含主 exe + cs.exe + portable.flag；运行时账号库/日志/配置与
      # WebView2 数据都落在 exe 目录（见 paths::portable_root），整体解压即用、
      # 拷走即迁移，不写注册表/用户目录。J-1：cs.exe 一并打包。
      - name: Build portable zip
        shell: pwsh
        run: |
          if (Test-Path portable-staging) { Remove-Item portable-staging -Recurse -Force }
          New-Item -ItemType Directory -Force portable-staging | Out-Null
          Copy-Item "src-tauri/target/release/claude-switcher.exe" `
            "portable-staging/ClaudeSwitcher.exe"
          Copy-Item "src-tauri/target/release/cs.exe" "portable-staging/cs.exe" -Force
          New-Item -ItemType File "portable-staging/portable.flag" | Out-Null
          Compress-Archive -Path "portable-staging/*" `
            -DestinationPath "ClaudeSwitcher-portable.zip" -Force
          Get-Item ClaudeSwitcher-portable.zip | Select-Object Name,Length

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-portable
          path: ClaudeSwitcher-portable.zip
          if-no-files-found: error

      # C-7：构建来源证明。用户可用
      #   gh attestation verify <文件> -R 48ytw4q7zg-sudo/claude-switcher-windows
      # 验证安装包确实来自本仓库 CI。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ClaudeSwitcher-portable.zip

      # C-8：校验和用裸文件名生成（在资产目录内 sha256sum *），
      # 用户可直接 `sha256sum -c SHA256SUMS.txt` 或对照 Get-FileHash。
      # productName 已去空格（ClaudeSwitcher），GitHub 不会再把资产名空格换成点。
      - name: Stage release assets with checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp ClaudeSwitcher-portable.zip dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # **P2-02**：至少要有 1 个 NSIS 安装包 + 1 个便携 zip 才允许发版。
      # 构建「静默少产出一个文件」是最常见的发版事故：成功日志 + 残缺资产。
      - name: Verify release assets are complete
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue)
          if ($nsis.Count -lt 1) { throw "No NSIS installer produced" }
          if (-not (Test-Path ClaudeSwitcher-portable.zip)) { throw "Portable zip missing" }
          $staged = @(Get-ChildItem dist-release -ErrorAction SilentlyContinue)
          if ($staged.Count -lt 3) { throw "dist-release must contain installer, zip and SHA256SUMS.txt" }
          Write-Host "assets OK: $($nsis.Count) installer(s) + portable zip"

      # C-7：tag 触发自动创建 Release（含 SHA256SUMS.txt），
      # 不再手工下载产物重传。workflow_dispatch 触发时只出 Actions 产物。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "${GITHUB_REF_NAME} — ClaudeSwitcher Windows" \
            --generate-notes
