[package]
name = "claude-switcher"
version = "0.2.1"
description = "Claude Code local account switcher (Windows)"
authors = ["48ytw4q7zg-sudo"]
edition = "2021"
# `slice::as_chunks` 等 API 需要 Rust 1.88+；显式声明，避免旧工具链报难懂的错。
rust-version = "1.88"
default-run = "claude-switcher"

# C-5：默认 release 配置产物 14MB+；lto + 单 codegen unit + 去符号显著减小体积。
# 不要加 panic = "abort"：spawn_blocking 的 JoinError 依赖 unwind，panic hook 也要。
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lib]
name = "claude_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "image-ico",
] }
tauri-plugin-opener = "2"
# 单实例：双击两次只留一个托盘图标，也避免并发写 store。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
urlencoding = "2"
# C2：store/备份里的 keychain_password（OAuth blob，唯一明文 token）落盘加密用。
aes-gcm = "0.10"
# 快照加密导出/导入的口令派生（Argon2id）。
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# HTTP：Claude OAuth usage/profile 与 Clash 控制器都走 reqwest。
# - system-proxy：读 Windows 注册表里的系统代理（Clash Verge「系统代理」开关就是它），
#   以及 HTTP_PROXY/HTTPS_PROXY 环境变量。**这是默认特性**，但我们关了 default-features，
#   必须显式加回来，否则只认环境变量。
# - rustls-tls-native-roots：信任 Windows 证书库（而非仅内置 Mozilla 根证书）。
#   装了会做 HTTPS 检查的杀软、或公司代理注入根证书的机器上必须用它。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "system-proxy",
    "rustls-tls-native-roots",
    # diagnose-proxy 与 clash 代理端口回退都要构造 socks5 / socks5h 代理：
    # 没有该 feature 时 Proxy::all 对 socks scheme 直接 builder error，
    # 上游明确支持的 socks5h 诊断会 100% 失败。
    "socks",
] }
# 进程检测（Claude Code CLI 是否在运行）：跨平台取 exe 名与命令行，
# 替代 Windows 上 PowerShell Get-CimInstance（慢、OEM 代码页乱码）。
sysinfo = "0.33"

# Windows：store 加密主密钥存到 Windows Credential Manager（与 macOS Keychain 对等）。
# Claude Code 本身的 OAuth 凭据在 Windows 上是 ~/.claude/.credentials.json 文件，无需 keyring。
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 稳定地识别硬链接（同卷+同文件索引）与硬链接计数；std 对应方法仍 unstable。
# Win32_System_IO：DeviceIoControl；Win32_System_Ioctl：FSCTL_GET_REPARSE_POINT
# （reparse tag 精确识别）；Win32_System_WindowsProgramming：GetUserNameW。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
# junction 是纯 API 调用，替代 cmd /C mklink /J（cmd 解析 % & ^ 出错、GBK 输出乱码）。
junction = "1"
# 开机自启：直接写 HKCU\...\Run，替代 reg.exe 子进程（后者的错误信息是本地化
# 字符串，中文系统上「删除一个不存在的值」会被误判成失败）。
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
